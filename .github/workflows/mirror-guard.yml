# Страж зеркала meerbot-android-sdk.
#
# Этот репозиторий — ЗЕРКАЛО. Исходник библиотеки живёт в приватном agentbot-platform
# (`mobile-sdk-android/`), а сюда его выкладывает `scripts/release-android-sdk-mirror.sh`
# срезом `git subtree split`. Правка, сделанная прямо здесь, в исходник не возвращается:
# следующий релиз соберёт срез без неё, а push упадёт как non-fast-forward — то есть
# работа либо теряется, либо блокирует выпуск версии.
#
# Как страж отличает релиз от ручной правки: релизный скрипт пушит ветку и тег версии
# ОДНОЙ атомарной командой, поэтому у каждого релизного коммита есть тег вида X.Y.Z.
# У ручного коммита тега нет — на нём job и падает.
#
# В монорепозитории файл не запускается: GitHub читает workflow только из корневого
# `.github/`, а здесь путь — `mobile-sdk-android/.github/`.

name: Страж зеркала

on:
  push:
    branches: [main]

jobs:
  check:
    name: Коммит пришёл из исходника
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: На коммите должен быть тег версии
        run: |
          # Теги пушатся тем же атомарным push, но реф успевает появиться не мгновенно.
          for attempt in 1 2 3; do
            git fetch --tags --force --quiet
            if git tag --points-at HEAD | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-.A-Za-z0-9]+)?$'; then
              echo "✅ релизный коммит: $(git tag --points-at HEAD | tr '\n' ' ')"
              exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep 10
          done

          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ❌ Правка сделана прямо в зеркале

          Этот репозиторий — **зеркало**, его содержимое перезаписывается из приватного
          `agentbot-platform` (каталог `mobile-sdk-android/`).

          Что произойдёт с этим коммитом, если ничего не делать:
          * следующий выпуск версии соберёт срез **без него** — правка пропадёт;
          * до того момента релизный скрипт будет падать на `non-fast-forward`.

          **Как вернуть правку в исходник** (в чекауте `agentbot-platform`):

          ```
          scripts/sync-sdk-mirror-back.sh android
          ```

          Скрипт перенесёт коммиты зеркала в `mobile-sdk-android/`. Дальше — обычный
          коммит в `agentbot-platform` и выпуск версии.

          **Как делать в следующий раз:** правки — в `agentbot-platform/mobile-sdk-android/`,
          затем `scripts/release-android-sdk-mirror.sh <версия>`.
          EOF

          echo "::error::Коммит без тега версии — похоже, правка сделана прямо в зеркале. Подробности во вкладке Summary."
          exit 1
